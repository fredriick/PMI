<svg width="100%" viewBox="0 0 680 480" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Full API key flow</title>
<desc>An API key is created and stored hashed, then configured with a scope and rate limit that can be updated any time via PATCH. On every request the gateway validates the key's hash, scope, and rate limit. The key can be revoked at any point, invalidating it immediately.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<g style="font-family:'Anthropic Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">

<!-- Create key (teal) -->
<rect x="210" y="30" width="260" height="56" rx="8" stroke-width="0.5" fill="rgb(225,245,238)" stroke="rgb(15,110,86)"/>
<text x="340" y="50" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(8,80,65)">Create key</text>
<text x="340" y="70" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(15,110,86)">POST /api/keys &#8212; hashed &amp; stored</text>

<line x1="340" y1="86" x2="340" y2="130" marker-end="url(#arrow)" stroke="rgb(137,135,129)" stroke-width="1.5"/>

<!-- Configure (purple) -->
<rect x="200" y="130" width="280" height="56" rx="8" stroke-width="0.5" fill="rgb(238,237,254)" stroke="rgb(83,74,183)"/>
<text x="340" y="150" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(60,52,137)">Configure</text>
<text x="340" y="170" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(83,74,183)">Scope + rate limit (updatable via PATCH)</text>

<line x1="340" y1="186" x2="340" y2="230" marker-end="url(#arrow)" stroke="rgb(137,135,129)" stroke-width="1.5"/>

<!-- Repeating container -->
<rect x="140" y="230" width="400" height="120" rx="16" fill="none" stroke="rgb(11,11,11)" stroke-opacity="0.2" stroke-width="0.5" stroke-dasharray="4 4"/>
<text x="160" y="252" font-size="12" fill="rgb(82,81,78)">On every request</text>
<text x="520" y="252" text-anchor="end" font-size="12" fill="rgb(82,81,78)">&#8635; repeats</text>

<!-- Validate & use (teal) -->
<rect x="190" y="262" width="300" height="56" rx="8" stroke-width="0.5" fill="rgb(225,245,238)" stroke="rgb(15,110,86)"/>
<text x="340" y="282" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(8,80,65)">Validate &amp; use</text>
<text x="340" y="302" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(15,110,86)">Check key hash, scope, rate limit</text>

<line x1="340" y1="350" x2="340" y2="390" marker-end="url(#arrow)" stroke="rgb(137,135,129)" stroke-width="1.5"/>

<!-- Revoke key (coral) -->
<rect x="210" y="390" width="260" height="56" rx="8" stroke-width="0.5" fill="rgb(250,236,231)" stroke="rgb(153,60,29)"/>
<text x="340" y="410" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="rgb(113,43,19)">Revoke key</text>
<text x="340" y="430" text-anchor="middle" dominant-baseline="central" font-size="12" fill="rgb(153,60,29)">DELETE &#8212; immediate invalidation</text>

</g>
</svg>
