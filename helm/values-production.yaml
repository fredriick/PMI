global:
  imageRegistry: ghcr.io
  imageRepository: fredriick/proxymesh
  imageTag: latest
  imagePullPolicy: IfNotPresent
  namespace: proxymesh

redis:
  image: redis:7-alpine
  password: ""
  storage: 20Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 4Gi

gateway:
  replicas: 5
  image: proxymesh
  port: 8000
  grpcPort: 9000
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "4"
      memory: 2Gi

config:
  gateway:
    host: "0.0.0.0"
    port: 8000
    mtlsEnabled: true
    caCertPath: "/etc/proxymesh/tls/ca.crt"
    serverCertPath: "/etc/proxymesh/tls/tls.crt"
    serverKeyPath: "/etc/proxymesh/tls/tls.key"
    circuitBreakerThreshold: 20
    rateLimitRequests: 500
    rateLimitWindowSeconds: 60
    rateLimitDistributed: true
    tracingEnabled: true
    cooldownSeconds: 1800
    requestTimeoutSeconds: 30
    idleTimeoutSeconds: 120
    readHeaderTimeoutSeconds: 10
    requestIdPrefix: "req"
    requestIdFormat: "unix"
    compression:
      enabled: true
      level: 5
    requestLoggingEnabled: true

  matchmaker:
    host: "localhost"
    port: 6379
    poolSize: 50
    cooldownTtlMinutes: 15

  redis:
    host: "proxymesh-redis"
    port: 6379
    password: ""
    db: 0
    clusterEnabled: false
    clusterAddrs: []
    sentinelEnabled: true
    sentinelAddrs: ["proxymesh-redis-sentinel-1:26379", "proxymesh-redis-sentinel-2:26379", "proxymesh-redis-sentinel-3:26379"]
    sentinelMaster: "mymaster"
    poolSize: 50
    maxRetries: 5

  compliance:
    blockedDomains:
      - "*.gov"
      - "*.mil"
      - "*.bankofamerica.com"
      - "*.chase.com"
      - "*.wellsfargo.com"
      - "*.illegal-content.*"
    kycRequired: true

  peer:
    minBatteryPercent: 20
    maxCpuPercent: 80
    requireUnmeteredWifi: true

  subnet:
    enabled: true
    prefix: "2001:db8::"
    prefixLen: 48

  pricing:
    tiers:
      - name: Basic
        minGbMonthly: 0
        maxGbMonthly: 10
        ratePerGbSent: 0.30
        ratePerGbRecv: 0.15
      - name: Premium
        minGbMonthly: 10
        maxGbMonthly: 100
        ratePerGbSent: 0.50
        ratePerGbRecv: 0.30
      - name: Enterprise
        minGbMonthly: 100
        maxGbMonthly: 10000
        ratePerGbSent: 0.80
        ratePerGbRecv: 0.50

  federation:
    enabled: true
    regions:
      - us-east
      - us-west
      - eu-west
      - ap-south
    heartbeatIntervalSeconds: 30
    syncIntervalSeconds: 60

  jwt:
    enabled: true
    secretKey: ""
    expiration: 24h

  rbac:
    enabled: true
    defaultRole: viewer
    minPasswordLen: 8
    maxLoginAttempts: 5
    lockoutDurationMinutes: 15

  prometheus:
    enabled: true
    pushGatewayUrl: "http://proxymesh-prometheus:9091"
    pushIntervalSeconds: 30
    jobName: "proxymesh_gateway"

ingress:
  enabled: true
  className: nginx
  host: proxymesh.io
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
