apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "proxymesh.fullname" . }}-gateway
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "proxymesh.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "proxymesh.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "proxymesh.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: gateway
    spec:
      {{- if .Values.gateway.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.gateway.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: gateway
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.global.imageRepository }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
            - name: grpc
              containerPort: {{ .Values.gateway.grpcPort }}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "proxymesh.fullname" . }}-secrets
                  key: redis-password
            - name: MTLS_ENABLED
              value: {{ (.Values.config.gateway.mtlsEnabled | ternary "true" "false") | quote }}
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: tls
              mountPath: /etc/proxymesh/tls
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "proxymesh.fullname" . }}-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: tls
          secret:
            secretName: {{ include "proxymesh.fullname" . }}-tls
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "proxymesh.fullname" . }}-gateway
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "proxymesh.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gateway
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: {{ include "proxymesh.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: grpc
      port: 9000
      targetPort: grpc
---
{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "proxymesh.fullname" . }}-gateway
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/name: {{ include "proxymesh.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "proxymesh.fullname" . }}-gateway
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
