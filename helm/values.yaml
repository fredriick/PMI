global:
  imageRegistry: ghcr.io
  imageRepository: fredriick/proxymesh
  imageTag: latest
  imagePullPolicy: IfNotPresent
  namespace: proxymesh

redis:
  image: redis:7-alpine
  password: ""
  storage: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

gateway:
  replicas: 2
  image: proxymesh
  port: 8000
  grpcPort: 9000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

config:
  gateway:
    host: "0.0.0.0"
    port: 8000
    mtlsEnabled: false
    caCertPath: "/etc/proxymesh/tls/ca.crt"
    serverCertPath: "/etc/proxymesh/tls/tls.crt"
    serverKeyPath: "/etc/proxymesh/tls/tls.key"
    circuitBreakerThreshold: 5
    rateLimitRequests: 100
    rateLimitWindowSeconds: 60
    rateLimitDistributed: true
    tracingEnabled: true
    cooldownSeconds: 3600
    requestTimeoutSeconds: 30
    idleTimeoutSeconds: 120
    readHeaderTimeoutSeconds: 10
    requestIdPrefix: "req"
    requestIdFormat: "unix"
    compression:
      enabled: true
      level: 5
    requestLoggingEnabled: false

  matchmaker:
    host: "localhost"
    port: 6379
    poolSize: 10
    cooldownTtlMinutes: 15

  redis:
    host: "proxymesh-redis"
    port: 6379
    password: ""
    db: 0
    clusterEnabled: false
    clusterAddrs: []
    poolSize: 10
    maxRetries: 3

  compliance:
    blockedDomains:
      - "*.gov"
      - "*.mil"
      - "*.bankofamerica.com"
      - "*.chase.com"
      - "*.wellsfargo.com"
      - "*.illegal-content.*"
    kycRequired: true

  peer:
    minBatteryPercent: 20
    maxCpuPercent: 80
    requireUnmeteredWifi: true

  subnet:
    enabled: true
    prefix: "2001:db8::"
    prefixLen: 48

  pricing:
    tiers:
      - name: Basic
        minGbMonthly: 0
        maxGbMonthly: 10
        ratePerGbSent: 0.30
        ratePerGbRecv: 0.15
      - name: Premium
        minGbMonthly: 10
        maxGbMonthly: 100
        ratePerGbSent: 0.50
        ratePerGbRecv: 0.30
      - name: Enterprise
        minGbMonthly: 100
        maxGbMonthly: 10000
        ratePerGbSent: 0.80
        ratePerGbRecv: 0.50

  federation:
    enabled: false
    regions:
      - us-east
      - us-west
      - eu-west
      - ap-south
    heartbeatIntervalSeconds: 30
    syncIntervalSeconds: 60

  jwt:
    enabled: false
    secretKey: ""
    expiration: 24h

  rbac:
    enabled: false
    defaultRole: viewer
    minPasswordLen: 8
    maxLoginAttempts: 5
    lockoutDurationMinutes: 15

  prometheus:
    enabled: false
    pushGatewayUrl: "http://proxymesh-prometheus:9091"
    pushIntervalSeconds: 30
    jobName: "proxymesh_gateway"

ingress:
  enabled: true
  className: nginx
  host: proxymesh.local
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
