apiVersion: v1
kind: ConfigMap
metadata:
  name: proxymesh-alerts
  namespace: monitoring
  labels:
    app: prometheus
data:
  alerts.yml: |
    groups:
      - name: proxymesh_alerts
        interval: 30s
        rules:
          - alert: ProxyMeshGatewayDown
            expr: up{job="proxymesh-gateway"} == 0
            for: 1m
            labels:
              severity: critical
              component: gateway
            annotations:
              summary: "ProxyMesh gateway is down"
              description: "Gateway {{ $labels.instance }} has been down for more than 1 minute."

          - alert: ProxyMeshRedisDown
            expr: up{job="proxymesh-redis"} == 0
            for: 1m
            labels:
              severity: critical
              component: redis
            annotations:
              summary: "ProxyMesh Redis is down"
              description: "Redis {{ $labels.instance }} has been down for more than 1 minute."

          - alert: HighErrorRate
            expr: rate(proxymesh_requests_failed_total[5m]) / rate(proxymesh_requests_total[5m]) > 0.05
            for: 2m
            labels:
              severity: warning
              component: gateway
            annotations:
              summary: "High error rate detected"
              description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes."

          - alert: HighLatency
            expr: histogram_quantile(0.95, rate(proxymesh_request_duration_seconds_bucket[5m])) > 0.5
            for: 3m
            labels:
              severity: warning
              component: gateway
            annotations:
              summary: "High latency detected"
              description: "95th percentile latency is {{ $value }}s."

          - alert: RateLimitExceeded
            expr: rate(proxymesh_rate_limited_total[5m]) > 10
            for: 2m
            labels:
              severity: warning
              component: gateway
            annotations:
              summary: "High rate limit count"
              description: "{{ $value }} requests per second are being rate limited."

          - alert: NodeOffline
            expr: proxymesh_node_status{status="offline"} == 1
            for: 1m
            labels:
              severity: warning
              component: nodes
            annotations:
              summary: "Node {{ $labels.node_id }} is offline"
              description: "Node {{ $labels.node_id }} has been offline for more than 1 minute."

          - alert: CriticalNodeCount
            expr: proxymesh_capacity_critical_nodes > 0
            for: 2m
            labels:
              severity: critical
              component: capacity
            annotations:
              summary: "{{ $value }} nodes in critical state"
              description: "There are {{ $value }} nodes in critical capacity state."

          - alert: WebSocketConnectionsLow
            expr: proxymesh_websocket_connections < 1
            for: 5m
            labels:
              severity: info
              component: websocket
            annotations:
              summary: "No WebSocket connections"
              description: "No admin WebSocket connections for 5 minutes."

          - alert: CircuitBreakerOpen
            expr: proxymesh_circuit_breaker_state == 1
            for: 1m
            labels:
              severity: critical
              component: circuit-breaker
            annotations:
              summary: "Circuit breaker {{ $labels.node_id }} is open"
              description: "Circuit breaker for node {{ $labels.node_id }} has been open for more than 1 minute."
